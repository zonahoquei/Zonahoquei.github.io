<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="theme-color" content="#061f38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZH Zona Hoquei App">

  <title>ZH Zona Hoquei App</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;width:100%;height:100%;
      overflow:hidden;background:#061f38;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    }

    #zh-shell-loader{
      position:fixed;inset:0;z-index:20;
      display:flex;align-items:center;justify-content:center;
      background:#061f38;color:#fff;
      transition:opacity .22s ease,visibility .22s ease;
    }
    #zh-shell-loader.fora{
      opacity:0;visibility:hidden;pointer-events:none;
    }
    .zh-shell-box{
      width:min(320px,82vw);
      text-align:center;
      padding:28px 18px;
    }
    .zh-shell-spinner{
      width:52px;height:52px;
      margin:0 auto 18px;
      border-radius:50%;
      border:5px solid rgba(255,255,255,.18);
      border-top-color:#fff;
      animation:zhShellSpin .78s linear infinite;
    }
    .zh-shell-title{
      font-size:21px;font-weight:900;letter-spacing:.1px;
    }
    .zh-shell-sub{
      margin-top:7px;
      color:#bcd2e8;
      font-size:14px;font-weight:700;
    }
    .zh-shell-time{
      display:inline-flex;
      align-items:center;justify-content:center;
      min-width:62px;height:32px;
      margin-top:14px;padding:0 12px;
      border:1px solid rgba(255,255,255,.25);
      border-radius:18px;
      background:rgba(255,255,255,.07);
      font-size:14px;font-weight:850;
      font-variant-numeric:tabular-nums;
    }
    #zh-shell-loader.amb-partits{display:block;overflow:auto;padding:18px 0;}
    #zh-shell-home{width:min(1120px,92vw);margin:0 auto;}
    .zh-home-cap{text-align:center;margin:10px 0 20px;}.zh-home-cap img{width:150px;max-width:45vw;height:auto;}
    .zh-home-cap h1{font-size:23px;margin:10px 0;}.zh-home-cap p{color:#bcd2e8;font-size:13px;margin:8px 0;}
    .zh-home-partit{background:#fff;color:#143c6c;border-radius:20px;padding:18px;margin:12px 0;border-left:6px solid #5d87b5;}
    .zh-home-meta{font-size:13px;font-weight:700;color:#526f8e;margin-bottom:10px;}
    .zh-home-equips{display:flex;align-items:center;gap:12px;font-weight:850;font-size:18px;}.zh-home-equips span{flex:1;}
    .zh-home-equips b{white-space:nowrap;background:#eef4fa;border-radius:12px;padding:8px 12px;font-size:18px;}
    @media(max-width:600px){.zh-home-partit{padding:14px;}.zh-home-equips{font-size:16px;}.zh-home-cap h1{font-size:20px;}}
    @keyframes zhShellSpin{to{transform:rotate(360deg)}}

    #emp-pro{
      position:fixed;inset:0;z-index:10;
      width:100%;height:100%;
      border:0;margin:0;padding:0;
      display:block;background:#061f38;
    }
  </style>
</head>

<body>

  <div id="zh-shell-loader" role="status" aria-live="polite">
    <div id="zh-shell-home" hidden></div>
    <div id="zh-shell-box" class="zh-shell-box">
      <div class="zh-shell-spinner"></div>
      <div class="zh-shell-title">Carregant ZonaHoquei...</div>
      <div class="zh-shell-sub">Preparant els teus partits</div>
      <div id="zh-shell-time" class="zh-shell-time">0 s</div>
    </div>
  </div>

  <iframe id="emp-pro"
          src="https://script.google.com/macros/s/AKfycbw7MfcJqnKlZ1t5M84OIn8PcJE36jMnLT49rJRM8YnYabpqL1z9nHKyDbqetKdw-cnr/exec"
          allow="fullscreen"
          loading="eager"
          fetchpriority="high"
          scrolling="yes"
          title="ZH Zona Hoquei App"></iframe>

  <script>
  (function(){
    'use strict';

    var frame=document.getElementById('emp-pro');
    var ZH_DEVICE_CODE_KEY='ZH_DEVICE_CODE_V1';
    var ZH_DEVICE_CODE_REMEMBER_KEY='ZH_DEVICE_CODE_REMEMBER_V1';
    var ZH_DEVICE_CODE_CACHE='zh-device-code-v1';
    var ZH_DEVICE_CODE_URL='/__zh_device_code__';
    var loader=document.getElementById('zh-shell-loader');
    var temps=document.getElementById('zh-shell-time');
    var inici=Date.now();
    var timer=null;
    var loaderFora=false;
    var previewMostrada=false;

    /*
     * V5.3 — diagnòstic lleuger d'arrencada.
     * No canvia el flux de càrrega; només mesura.
     */
    var zhDiag={
      iniciMs:Date.now(),
      iframeLoadMs:null,
      appReadyMs:null,
      loaderForaMs:null,
      primerIdMs:null,
      enviamentsId:0
    };

    window.ZH_DIAG_CARREGA=zhDiag;

    function zhDiagGuardar(){
      try{
        sessionStorage.setItem(
          'ZH_DIAG_CARREGA',
          JSON.stringify(zhDiag)
        );
      }catch(e){}
    }

    function idValid(id){
      return /^[A-Za-z0-9_-]{1,80}$/.test(String(id||'').trim());
    }



    






    /*
     * V5.27 — base estable V5.5 + ID anònim obligatori de dispositiu.
     */
    var RPC_PREFIX='ZH_RPC_V1|';
    var RPC_MAX_ENTRADES=18;
    var RPC_MAX_TOTAL=3800000;
    var rpcEnviat=false;

    var RPC_PERSISTIBLES={
      obtenirPartitsApp:1,
      obtenirResultatsApp:1,
      obtenirAlMinutApp:1,
      obtenirClassificacionsApp:1,
      EMP_JUGADORS_BD26_obtenir:1,
      EMP_JUGADORS_BD26_obtenirLleuger:1,
      EMP_JUGADORS_BD26_detall:1,
      EMP_APP_BD26_obtenirActa:1,
      EMP_USR_obtenirCataleg:1,
      EMP_USR_obtenirCatalegJugadors:1,
      EMP_USR_obtenirCatalegJugadorsLleuger:1
    };

    function rpcTTL(nom){
      if(
        nom==='obtenirPartitsApp' ||
        nom==='obtenirResultatsApp' ||
        nom==='obtenirAlMinutApp' ||
        nom==='EMP_APP_BD26_obtenirActa'
      )return 2*60*1000;

      if(nom==='obtenirClassificacionsApp')return 2*60*1000;
      if(nom==='EMP_JUGADORS_BD26_detall')return 2*60*1000;

      if(
        nom==='EMP_JUGADORS_BD26_obtenir' ||
        nom==='EMP_JUGADORS_BD26_obtenirLleuger'
      )return 2*60*1000;

      if(
        nom==='EMP_USR_obtenirCataleg' ||
        nom==='EMP_USR_obtenirCatalegJugadors' ||
        nom==='EMP_USR_obtenirCatalegJugadorsLleuger'
      )return 6*60*60*1000;

      return 2*60*1000;
    }

    var HOME_PREVIEW_KEY='ZH_HOME_PREVIEW_V1';
    var FAVORITS_PREVIEW_KEY='ZH_FAVORITS_PREVIEW_V1';
    var RPC_PANTALLES={obtenirPartitsApp:1,obtenirResultatsApp:1,obtenirAlMinutApp:1,obtenirClassificacionsApp:1,EMP_JUGADORS_BD26_obtenir:1,EMP_JUGADORS_BD26_obtenirLleuger:1};
    function rpcOrdenar(items){
      items.sort(function(a,b){return Number(b.temps||0)-Number(a.temps||0);});
      var reservats=items.filter(function(x){return RPC_PANTALLES[x.nom];}).slice(0,6);
      return items.sort(function(a,b){return (reservats.indexOf(b)>=0)-(reservats.indexOf(a)>=0)||Number(b.temps||0)-Number(a.temps||0);});
    }
    function previewsLlegir(){
      try{return (JSON.parse(localStorage.getItem(HOME_PREVIEW_KEY)||'[]')||[]).filter(function(x){return x&&x.temps&&Date.now()-x.temps<86400000;});}catch(e){return [];}
    }
    function previewGuardar(d){
      if(!d||!llegirRecordarCodi_()||d.nom!=='obtenirPartitsApp'||!d.dades||!d.dades.ok||!d.args||d.args[2])return;
      var items=previewsLlegir().filter(function(x){return x.args[1]!==d.args[1]||x.dades.dataInicial!==d.dades.dataInicial;});
      items.unshift({nom:d.nom,args:d.args,temps:d.temps,dades:d.dades});
      items=items.slice(0,4);while(items.length&&JSON.stringify(items).length>600000)items.pop();
      try{localStorage.setItem(HOME_PREVIEW_KEY,JSON.stringify(items));}catch(e){}
    }
    function primeraVistaGuardada(){
      var codi=llegirCodiDispositiu_();
      if(!llegirRecordarCodi_()||!/^\d{4,12}$/.test(codi))return null;
      var uid='USR_AUTO_'+('0'+codi.length.toString(16)).slice(-2)+('00000000000000'+codi).slice(-14);
      var avui=new Date(),d=new Date(avui.getFullYear(),avui.getMonth(),avui.getDate());
      d.setDate(d.getDate()+(d.getDay()===0?-6:1-d.getDay()));
      var inici=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      return previewsLlegir().find(function(x){return x.args&&x.args[1]===uid&&!x.args[2]&&x.dades&&x.dades.ok&&x.dades.dataInicial===inici;})||null;
    }
    function htmlPrimeraVista(x,f){
      function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
      function dia(v){var a=String(v||'').split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v;}
      var d=x.dades,colors=f&&f.idUsuari===x.args[1]&&f.favorits?f.favorits.colorsEquips||{}:{};
      var html='<div class="zh-home-cap"><img src="./ZH-Zona-Hoquei-App-logo-300px.png" alt="ZonaHoquei"><h1>Els meus partits</h1><p>'+esc(dia(d.dataInicial))+' · '+esc(dia(d.dataFinal))+'</p><p>Dades guardades · Preparant l’app i comprovant actualització…</p></div>';
      if(!d.partits||!d.partits.length)return html+'<div class="zh-home-partit">No hi ha partits aquesta setmana.</div>';
      return html+d.partits.slice(0,12).map(function(p){
        var color=colors[p.idEquipLocal]||colors[p.idEquipVisitant]||'',estil='';
        if(/^#[a-f0-9]{6}$/i.test(color)){
          var rgb=[1,3,5].map(function(i){return parseInt(color.slice(i,i+2),16);});
          var suau='rgb('+rgb.map(function(n){return Math.round(n*.18+255*.82);}).join(',')+')';
          estil=' style="border-left-color:'+color+';background:'+suau+'"';
        }
        return '<article class="zh-home-partit"'+estil+'><div class="zh-home-meta">'+esc(dia(p.data))+' · '+esc(p.hora)+' · '+esc(p.categoria)+'</div><div class="zh-home-equips"><span>'+esc(p.local)+' — '+esc(p.visitant)+'</span><b>'+esc(p.resultat&&p.resultat!=='-'&&p.resultat!=='—'?p.resultat:'Pendent')+'</b></div></article>';
      }).join('');
    }
    function mostrarPrimeraVista(){
      if(loaderFora||previewMostrada)return;
      var x=primeraVistaGuardada(),zona=document.getElementById('zh-shell-home');
      if(!x||!zona)return;
      var f=null;try{f=JSON.parse(localStorage.getItem(FAVORITS_PREVIEW_KEY)||'null');}catch(e){}
      zona.innerHTML=htmlPrimeraVista(x,f);zona.hidden=false;
      var box=document.getElementById('zh-shell-box');if(box)box.hidden=true;
      loader.classList.add('amb-partits');previewMostrada=true;
      zhDiag.homeGuardadaMs=Date.now()-zhDiag.iniciMs;zhDiagGuardar();
    }

    function dadesSessioCache_(){
      if(!llegirRecordarCodi_())return {};
      var f=null;try{f=JSON.parse(localStorage.getItem(FAVORITS_PREVIEW_KEY)||'null');}catch(e){}
      return {previewPartits:previewsLlegir(),favoritsCache:f&&Date.now()-f.temps<86400000?f:null};
    }

    function rpcHash(s){
      var h=2166136261;
      for(var i=0;i<s.length;i++){
        h^=s.charCodeAt(i);
        h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);
      }
      return (h>>>0).toString(36);
    }

    function rpcClau(nom,args){
      var base=String(nom||'')+'|'+JSON.stringify(args||[]);
      return RPC_PREFIX+String(nom||'')+'|'+rpcHash(base);
    }

    function rpcNetejarCaducats(){
      var ara=Date.now(),items=[];

      try{
        for(var i=localStorage.length-1;i>=0;i--){
          var k=localStorage.key(i);
          if(!k || k.indexOf(RPC_PREFIX)!==0)continue;

          var raw=localStorage.getItem(k)||'';
          var x=null;
          try{x=JSON.parse(raw);}catch(e){}

          if(
            !x ||
            !RPC_PERSISTIBLES[x.nom] ||
            !x.temps ||
            ara-Number(x.temps)>rpcTTL(x.nom)
          ){
            localStorage.removeItem(k);
            continue;
          }

          items.push({k:k,nom:x.nom,temps:Number(x.temps||0),mida:raw.length});
        }
      }catch(e){}

      rpcOrdenar(items);

      var total=0;
      items.forEach(function(x,idx){
        total+=x.mida;
        if(idx>=RPC_MAX_ENTRADES || total>RPC_MAX_TOTAL){
          try{localStorage.removeItem(x.k);}catch(e){}
        }
      });
    }

    function rpcGuardar(d){
      previewGuardar(d);
      if(!d || !RPC_PERSISTIBLES[d.nom])return;

      var x={
        nom:String(d.nom||''),
        args:Array.isArray(d.args)?d.args:[],
        temps:Number(d.temps||Date.now()),
        dades:d.dades
      };

      try{
        var raw=JSON.stringify(x);
        if(raw.length>900000)return;

        localStorage.setItem(rpcClau(x.nom,x.args),raw);
        rpcNetejarCaducats();
      }catch(e){
        rpcNetejarCaducats();
      }
    }

    function rpcEsborrarTot(){
      try{localStorage.removeItem(HOME_PREVIEW_KEY);}catch(e){}
      try{
        for(var i=localStorage.length-1;i>=0;i--){
          var k=localStorage.key(i);
          if(k && k.indexOf(RPC_PREFIX)===0){
            localStorage.removeItem(k);
          }
        }
      }catch(e){}
      rpcEnviat=false;
    }

    function rpcLlegir(){
      rpcNetejarCaducats();

      var out=[];
      try{
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(!k || k.indexOf(RPC_PREFIX)!==0)continue;

          var x=null;
          try{x=JSON.parse(localStorage.getItem(k)||'null');}catch(e){}

          if(x && RPC_PERSISTIBLES[x.nom]){
            out.push(x);
          }
        }
      }catch(e){}

      rpcOrdenar(out);

      return out.slice(0,RPC_MAX_ENTRADES);
    }

    function rpcEnviarAlFrame(destinatari){
      destinatari=destinatari&&destinatari.postMessage?destinatari:(frame&&frame.contentWindow);
      if(!destinatari || rpcEnviat===destinatari)return;

      var entrades=rpcLlegir();
      rpcEnviat=destinatari;

      if(!entrades.length)return;

      try{
        destinatari.postMessage({
          tipus:'ZH_RPC_CACHE_BULK',
          entrades:entrades
        },'*');
      }catch(e){}
    }

    /*
     * V5.5 — snapshot visual de Classificacions i Jugadors.
     * Es guarda al domini GitHub per sobreviure al tancament complet
     * de la PWA.
     */









    async function cacheCodiLlegir_(){
      try{
        if(!('caches' in window))return '';
        var c=await caches.open(ZH_DEVICE_CODE_CACHE);
        var r=await c.match(ZH_DEVICE_CODE_URL);
        if(!r)return '';
        var d=await r.json();
        if(!d||!d.recordar)return '';
        return String(d.codi||'').replace(/\D+/g,'').substring(0,12);
      }catch(e){return '';}
    }

    async function cacheCodiGuardar_(codi,recordar){
      try{
        if(!('caches' in window))return;
        var c=await caches.open(ZH_DEVICE_CODE_CACHE);
        if(!recordar||!codi){
          await c.delete(ZH_DEVICE_CODE_URL);
          return;
        }
        await c.put(
          ZH_DEVICE_CODE_URL,
          new Response(JSON.stringify({codi:String(codi||''),recordar:true}),{
            headers:{'Content-Type':'application/json'}
          })
        );
      }catch(e){}
    }

    function llegirRecordarCodi_(){
      try{
        return localStorage.getItem(
          ZH_DEVICE_CODE_REMEMBER_KEY
        )==='1';
      }catch(e){
        return false;
      }
    }

    function llegirCodiDispositiu_(){
      if(!llegirRecordarCodi_()){
        return '';
      }

      try{
        return String(
          localStorage.getItem(
            ZH_DEVICE_CODE_KEY
          )||''
        ).trim();
      }catch(e){
        return '';
      }
    }

    function guardarCodiDispositiu_(codi,recordar){
      codi=String(codi||'')
        .replace(/\D+/g,'')
        .substring(0,12);

      recordar=!!recordar;
      if(!recordar){try{localStorage.removeItem(HOME_PREVIEW_KEY);localStorage.removeItem(FAVORITS_PREVIEW_KEY);}catch(e){}}

      cacheCodiGuardar_(codi,recordar);

      try{
        localStorage.setItem(
          ZH_DEVICE_CODE_REMEMBER_KEY,
          recordar ? '1' : '0'
        );

        if(recordar && codi){
          localStorage.setItem(
            ZH_DEVICE_CODE_KEY,
            codi
          );
        }else{
          localStorage.removeItem(
            ZH_DEVICE_CODE_KEY
          );
        }

        return true;
      }catch(e){
        return false;
      }
    }

    function amagarLoader(forcar){
      if(previewMostrada&&zhDiag.homeReadyMs==null&&!forcar)return;
      if(loaderFora)return;
      loaderFora=true;

      if(zhDiag.loaderForaMs==null){
        zhDiag.loaderForaMs=Date.now()-zhDiag.iniciMs;
        zhDiagGuardar();
      }

      if(timer)clearInterval(timer);
      if(loader){
        loader.classList.add('fora');
        setTimeout(function(){
          if(loader&&loader.parentNode)loader.parentNode.removeChild(loader);
        },260);
      }
    }

    timer=setInterval(function(){
      if(temps){
        temps.textContent=Math.max(0,Math.floor((Date.now()-inici)/1000))+' s';
      }
    },500);

    function missatgeDelFrame(e){
      if(!frame || !e.source)return false;
      if(!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(e.origin))return false;
      // Comprova la descendència del nostre iframe, també amb els marcs de Google.
      try{
        var origen=e.source;
        for(var i=0;i<8;i++){
          if(origen===frame.contentWindow)return true;
          var pare=origen.parent;
          if(!pare || pare===origen || pare===window)return false;
          origen=pare;
        }
      }catch(err){}
      return false;
    }

    window.addEventListener('message',function(e){
      if(!missatgeDelFrame(e))return;
      var destinatari=e.source;

      var d=e.data||{};

      if(d.tipus==='ZH_DEVICE_CODE_GET'){
        rpcEnviarAlFrame(destinatari);
        var codiMem=llegirCodiDispositiu_();
        if(codiMem && llegirRecordarCodi_()){
          try{
            destinatari.postMessage(Object.assign({
              tipus:'ZH_DEVICE_CODE_VALUE',codi:codiMem,recordar:true
            },dadesSessioCache_()),'*');
          }catch(e){}
          return;
        }

        cacheCodiLlegir_().then(function(codiCache){
          if(codiCache)guardarCodiDispositiu_(codiCache,true);
          mostrarPrimeraVista();
          try{
            destinatari.postMessage({
              tipus:'ZH_DEVICE_CODE_VALUE',
              codi:codiCache||'',
              recordar:!!codiCache
            },'*');
          }catch(e){}
        });
        return;
      }

      if(d.tipus==='ZH_DEVICE_CODE_SET'){
        guardarCodiDispositiu_(
          d.codi,
          d.recordar
        );

        try{
          destinatari.postMessage(
            {
              tipus:'ZH_DEVICE_CODE_VALUE',
              codi:llegirCodiDispositiu_(),
              recordar:llegirRecordarCodi_()
            },
            '*'
          );
        }catch(e){}
        return;
      }

      if(d.tipus==='EMP_USR_SET_ID'){
        return;
      }

      if(d.tipus==='ZH_DOCUMENT_READY' || d.tipus==='ZH_APP_READY'){
        rpcEnviarAlFrame(destinatari);
        if(zhDiag.appReadyMs==null){
          zhDiag.appReadyMs=Date.now()-zhDiag.iniciMs;
          zhDiagGuardar();
        }

        amagarLoader();
        return;
      }

      if(d.tipus==='ZH_FAVORITS_CACHE_SET'){
        if(idValid(d.idUsuari)&&d.favorits&&llegirRecordarCodi_()){
          try{localStorage.setItem(FAVORITS_PREVIEW_KEY,JSON.stringify({idUsuari:d.idUsuari,temps:Date.now(),favorits:d.favorits}));}catch(e){}
        }
        return;
      }
      if(d.tipus==='ZH_HOME_READY'){
        if(zhDiag.homeReadyMs==null)zhDiag.homeReadyMs=Date.now()-zhDiag.iniciMs;
        if(d.etapa==='actual'&&zhDiag.homeActualMs==null)zhDiag.homeActualMs=Date.now()-zhDiag.iniciMs;
        zhDiagGuardar();amagarLoader();return;
      }

      if(d.tipus==='ZH_RPC_CACHE_SET'){
        rpcGuardar(d);
        return;
      }

      if(d.tipus==='ZH_RPC_CACHE_CLEAR'){
        rpcEsborrarTot();
        return;
      }
    });

    frame.addEventListener('load',function(){
      zhDiag.iframeLoadMs=Date.now()-zhDiag.iniciMs;
      zhDiagGuardar();

      // V5.4: restaurem primer el cache persistent de pantalles.
      rpcEnviat=false;
      rpcEnviarAlFrame();

      // L'HTML d'Apps Script ja és visible. No esperem dades de Sheets:
      // l'app mostrarà el seu propi estat "Carregant..." dins del contingut.
      amagarLoader();

      try{
        frame.contentWindow.postMessage(
          {
            tipus:'ZH_DEVICE_CODE_VALUE',
            codi:llegirCodiDispositiu_(),
            recordar:llegirRecordarCodi_()
          },
          '*'
        );
      }catch(e){}
      setTimeout(rpcEnviarAlFrame,250);

      setTimeout(function(){
        try{
          console.log(
            'ZH DIAG CARREGA',
            JSON.parse(JSON.stringify(zhDiag))
          );
        }catch(e){}
      },1200);
    });

    // L'iframe ja ha començat a carregar des del mateix HTML.
    // Enviem la identitat tan aviat com sigui possible.

    // Seguretat: si mai no arriba ZH_APP_READY, no bloquegem la PWA.
    mostrarPrimeraVista();
    setTimeout(function(){amagarLoader(true);},4000);

    window.ZH_DIAG_MOSTRAR=function(){
      var r={
        iniciMs:zhDiag.iniciMs,
        iframeLoadMs:zhDiag.iframeLoadMs,
        appReadyMs:zhDiag.appReadyMs,
        loaderForaMs:zhDiag.loaderForaMs,
        primerIdMs:zhDiag.primerIdMs,
        enviamentsId:zhDiag.enviamentsId
      };

      try{
        console.log('ZH DIAG CARREGA',r);
      }catch(e){}

      return r;
    };

  })();
  </script>

</body>
