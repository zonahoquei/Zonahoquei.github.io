<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="theme-color" content="#061f38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZH Zona Hoquei App">

  <title>ZH Zona Hoquei App</title>

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;width:100%;height:100%;
      overflow:hidden;background:#061f38;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    }

    #zh-shell-loader{
      position:fixed;inset:0;z-index:20;
      display:flex;align-items:center;justify-content:center;
      background:#061f38;color:#fff;
      transition:opacity .22s ease,visibility .22s ease;
    }
    #zh-shell-loader.fora{
      opacity:0;visibility:hidden;pointer-events:none;
    }
    .zh-shell-box{
      width:min(320px,82vw);
      text-align:center;
      padding:28px 18px;
    }
    .zh-shell-spinner{
      width:52px;height:52px;
      margin:0 auto 18px;
      border-radius:50%;
      border:5px solid rgba(255,255,255,.18);
      border-top-color:#fff;
      animation:zhShellSpin .78s linear infinite;
    }
    .zh-shell-title{
      font-size:21px;font-weight:900;letter-spacing:.1px;
    }
    .zh-shell-sub{
      margin-top:7px;
      color:#bcd2e8;
      font-size:14px;font-weight:700;
    }
    .zh-shell-time{
      display:inline-flex;
      align-items:center;justify-content:center;
      min-width:62px;height:32px;
      margin-top:14px;padding:0 12px;
      border:1px solid rgba(255,255,255,.25);
      border-radius:18px;
      background:rgba(255,255,255,.07);
      font-size:14px;font-weight:850;
      font-variant-numeric:tabular-nums;
    }
    @keyframes zhShellSpin{to{transform:rotate(360deg)}}
#emp-pro{
      position:fixed;inset:0;z-index:10;
      width:100%;height:100%;
      border:0;margin:0;padding:0;
      display:block;background:#061f38;
    }
  </style>
</head>

<body>

  <div id="zh-shell-loader" role="status" aria-live="polite">
    <div class="zh-shell-box">
      <div class="zh-shell-spinner"></div>
      <div class="zh-shell-title">Carregant ZonaHoquei...</div>
      <div class="zh-shell-sub">Preparant els teus partits</div>
      <div id="zh-shell-time" class="zh-shell-time">0 s</div>
    </div>
  </div>
</div>

  <iframe id="emp-pro"
          src="https://script.google.com/macros/s/AKfycbw7MfcJqnKlZ1t5M84OIn8PcJE36jMnLT49rJRM8YnYabpqL1z9nHKyDbqetKdw-cnr/exec"
          allow="fullscreen"
          loading="eager"
          fetchpriority="high"
          scrolling="yes"
          title="ZH Zona Hoquei App"></iframe>

  <script>
  (function(){
    'use strict';

    var CLAU='EMP_PRO_ID_USUARI';
    var COOKIE='EMP_PRO_ID_USUARI';
    var AUTO_PREFIX='USR_AUTO_';
    var ONBOARDING_PREFIX='ZH_AUTO_ONBOARDING|';
    var frame=document.getElementById('emp-pro');
    var loader=document.getElementById('zh-shell-loader');
    var temps=document.getElementById('zh-shell-time');
    var inici=Date.now();
    var timer=null;
    var loaderFora=false;

    /*
     * V5.3 — diagnòstic lleuger d'arrencada.
     * No canvia el flux de càrrega; només mesura.
     */
    var zhDiag={
      iniciMs:Date.now(),
      iframeLoadMs:null,
      appReadyMs:null,
      loaderForaMs:null,
      primerIdMs:null,
      enviamentsId:0
    };

    window.ZH_DIAG_CARREGA=zhDiag;

    function zhDiagGuardar(){
      try{
        sessionStorage.setItem(
          'ZH_DIAG_CARREGA',
          JSON.stringify(zhDiag)
        );
      }catch(e){}
    }

    function idValid(id){
      return /^[A-Za-z0-9_-]{1,80}$/.test(String(id||'').trim());
    }

    function llegirId(){
      var id='';
      try{
        id=String(localStorage.getItem(CLAU)||'').trim();
        if(idValid(id))return id;
      }catch(e){}

      try{
        var parts=(document.cookie||'').split(';');
        for(var i=0;i<parts.length;i++){
          var p=parts[i].trim();
          if(p.indexOf(COOKIE+'=')===0){
            id=decodeURIComponent(p.substring(COOKIE.length+1));
            if(idValid(id))return id;
          }
        }
      }catch(e){}

      return '';
    }
    function generarAutoId(){
      var bytes=new Uint8Array(12);

      try{
        if(window.crypto && window.crypto.getRandomValues){
          window.crypto.getRandomValues(bytes);
        }else{
          for(var i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
        }
      }catch(e){
        for(var j=0;j<bytes.length;j++)bytes[j]=Math.floor(Math.random()*256);
      }

      var hex='';
      for(var k=0;k<bytes.length;k++){
        hex+=bytes[k].toString(16).padStart(2,'0');
      }

      return AUTO_PREFIX+hex;
    }

    function onboardingClau(id){
      return ONBOARDING_PREFIX+String(id||'');
    }

    function onboardingPendent(id){
      try{
        return localStorage.getItem(onboardingClau(id))==='1';
      }catch(e){
        return false;
      }
    }

    function onboardingMarcar(id){
      try{
        localStorage.setItem(onboardingClau(id),'1');
      }catch(e){}
    }

    function onboardingAcabar(id){
      try{
        localStorage.removeItem(onboardingClau(id));
      }catch(e){}
    }

    function copiarCacheId(origen,desti){
      if(!origen||!desti||origen===desti)return;

      try{
        var fav=llegirJSON('ZH_FAVS|'+origen);
        if(fav)guardarJSON('ZH_FAVS|'+desti,fav);

        var data=dillunsActual();
        var home=llegirJSON('ZH_HOME|'+origen+'|'+data);
        if(home)guardarJSON('ZH_HOME|'+desti+'|'+data,home);
      }catch(e){}
    }

    function assegurarId(){
      var actual=llegirId();

      /*
       * Si ja és el nou ID anònim del dispositiu, el reutilitzem.
       * Qualsevol identificador antic (USR_..., ZH_DEV_...) es migra
       * UNA vegada al nou sistema anònim.
       */
      if(/^USR_AUTO_[A-Fa-f0-9]{16,64}$/.test(actual)){
        return actual;
      }

      var id=generarAutoId();

      if(actual){
        copiarCacheId(actual,id);
      }

      guardarId(id);
      onboardingMarcar(id);

      return id;
    }


    function dillunsActual(){
      var a=new Date();
      var delta=a.getDay()===0?-6:1-a.getDay();
      var d=new Date(a.getFullYear(),a.getMonth(),a.getDate());
      d.setDate(d.getDate()+delta);
      return d.getFullYear()+'-'+
        String(d.getMonth()+1).padStart(2,'0')+'-'+
        String(d.getDate()).padStart(2,'0');
    }

    function llegirJSON(clau){
      try{
        return JSON.parse(localStorage.getItem(clau)||'null');
      }catch(e){
        return null;
      }
    }

    function guardarJSON(clau,valor){
      try{
        localStorage.setItem(clau,JSON.stringify(valor));
        return true;
      }catch(e){
        return false;
      }
    }

    /*
     * V5.12 — ID persistent protegit + obertura estable.
     */
    var RPC_PREFIX='ZH_RPC_V1|';
    var RPC_MAX_ENTRADES=18;
    var RPC_MAX_TOTAL=3800000;
    var rpcEnviat=false;

    var RPC_PERSISTIBLES={
      obtenirPartitsApp:1,
      obtenirResultatsApp:1,
      obtenirAlMinutApp:1,
      obtenirClassificacionsApp:1,
      EMP_JUGADORS_BD26_obtenir:1,
      EMP_JUGADORS_BD26_obtenirLleuger:1,
      EMP_JUGADORS_BD26_detall:1,
      EMP_APP_BD26_obtenirActa:1,
      EMP_USR_obtenirCataleg:1,
      EMP_USR_obtenirCatalegJugadors:1,
      EMP_USR_obtenirCatalegJugadorsLleuger:1
    };

    function rpcTTL(nom){
      if(
        nom==='obtenirPartitsApp' ||
        nom==='obtenirResultatsApp' ||
        nom==='obtenirAlMinutApp' ||
        nom==='EMP_APP_BD26_obtenirActa'
      )return 2*60*1000;

      if(nom==='obtenirClassificacionsApp')return 10*60*1000;
      if(nom==='EMP_JUGADORS_BD26_detall')return 20*60*1000;

      if(
        nom==='EMP_JUGADORS_BD26_obtenir' ||
        nom==='EMP_JUGADORS_BD26_obtenirLleuger'
      )return 30*60*1000;

      if(
        nom==='EMP_USR_obtenirCataleg' ||
        nom==='EMP_USR_obtenirCatalegJugadors' ||
        nom==='EMP_USR_obtenirCatalegJugadorsLleuger'
      )return 6*60*60*1000;

      return 20*60*1000;
    }

    function rpcHash(s){
      var h=2166136261;
      for(var i=0;i<s.length;i++){
        h^=s.charCodeAt(i);
        h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);
      }
      return (h>>>0).toString(36);
    }

    function rpcClau(nom,args){
      var base=String(nom||'')+'|'+JSON.stringify(args||[]);
      return RPC_PREFIX+String(nom||'')+'|'+rpcHash(base);
    }

    function rpcNetejarCaducats(){
      var ara=Date.now(),items=[];

      try{
        for(var i=localStorage.length-1;i>=0;i--){
          var k=localStorage.key(i);
          if(!k || k.indexOf(RPC_PREFIX)!==0)continue;

          var raw=localStorage.getItem(k)||'';
          var x=null;
          try{x=JSON.parse(raw);}catch(e){}

          if(
            !x ||
            !RPC_PERSISTIBLES[x.nom] ||
            !x.temps ||
            ara-Number(x.temps)>rpcTTL(x.nom)
          ){
            localStorage.removeItem(k);
            continue;
          }

          items.push({k:k,temps:Number(x.temps||0),mida:raw.length});
        }
      }catch(e){}

      items.sort(function(a,b){return b.temps-a.temps;});

      var total=0;
      items.forEach(function(x,idx){
        total+=x.mida;
        if(idx>=RPC_MAX_ENTRADES || total>RPC_MAX_TOTAL){
          try{localStorage.removeItem(x.k);}catch(e){}
        }
      });
    }

    function rpcGuardar(d){
      if(!d || !RPC_PERSISTIBLES[d.nom])return;

      var x={
        nom:String(d.nom||''),
        args:Array.isArray(d.args)?d.args:[],
        temps:Number(d.temps||Date.now()),
        dades:d.dades
      };

      try{
        var raw=JSON.stringify(x);
        if(raw.length>900000)return;

        localStorage.setItem(rpcClau(x.nom,x.args),raw);
        rpcNetejarCaducats();
      }catch(e){
        rpcNetejarCaducats();
      }
    }

    function rpcEsborrarTot(){
      try{
        for(var i=localStorage.length-1;i>=0;i--){
          var k=localStorage.key(i);
          if(k && k.indexOf(RPC_PREFIX)===0){
            localStorage.removeItem(k);
          }
        }
      }catch(e){}
      rpcEnviat=false;
    }

    function rpcLlegir(){
      rpcNetejarCaducats();

      var out=[];
      try{
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(!k || k.indexOf(RPC_PREFIX)!==0)continue;

          var x=null;
          try{x=JSON.parse(localStorage.getItem(k)||'null');}catch(e){}

          if(x && RPC_PERSISTIBLES[x.nom]){
            out.push(x);
          }
        }
      }catch(e){}

      out.sort(function(a,b){
        return Number(b.temps||0)-Number(a.temps||0);
      });

      return out.slice(0,RPC_MAX_ENTRADES);
    }

    function rpcEnviarAlFrame(){
      if(rpcEnviat || !frame || !frame.contentWindow)return;

      var entrades=rpcLlegir();
      rpcEnviat=true;

      if(!entrades.length)return;

      try{
        frame.contentWindow.postMessage({
          tipus:'ZH_RPC_CACHE_BULK',
          entrades:entrades
        },'*');
      }catch(e){}
    }

    /*
     * V5.5 — snapshot visual de Classificacions i Jugadors.
     * Es guarda al domini GitHub per sobreviure al tancament complet
     * de la PWA.
     */
    var VIEW_PREFIX='ZH_VIEW_V1|';
    var VIEW_TTL_MS=30*60*1000;
    var VIEW_MAX_RAW=1200000;

    function viewClau(id,vista){
      return VIEW_PREFIX+String(id||'')+'|'+String(vista||'');
    }

    function viewGuardar(d){
      var id=String((d&&d.idUsuari)||'').trim();
      var vista=String((d&&d.vista)||'').trim();

      if(!idValid(id))return;
      if(vista!=='classificacions' && vista!=='jugadors')return;

      var x={
        idUsuari:id,
        vista:vista,
        temps:Number(d.temps||Date.now()),
        dades:d.dades||{}
      };

      try{
        var raw=JSON.stringify(x);
        if(raw.length>VIEW_MAX_RAW)return;
        localStorage.setItem(viewClau(id,vista),raw);
      }catch(e){}
    }

    function viewLlegirUna(id,vista){
      try{
        var x=JSON.parse(localStorage.getItem(viewClau(id,vista))||'null');

        if(
          !x ||
          String(x.idUsuari||'')!==String(id||'') ||
          Date.now()-Number(x.temps||0)>VIEW_TTL_MS
        ){
          try{localStorage.removeItem(viewClau(id,vista));}catch(e){}
          return null;
        }

        return x;
      }catch(e){
        return null;
      }
    }

    function viewLlegir(id){
      if(!idValid(id))return null;

      return {
        classificacions:viewLlegirUna(id,'classificacions'),
        jugadors:viewLlegirUna(id,'jugadors')
      };
    }

    function viewEsborrarTot(){
      try{
        for(var i=localStorage.length-1;i>=0;i--){
          var k=localStorage.key(i);
          if(k && k.indexOf(VIEW_PREFIX)===0){
            localStorage.removeItem(k);
          }
        }
      }catch(e){}
    }


    function favoritsCache(id){
      if(!id)return null;
      return llegirJSON('ZH_FAVS|'+id);
    }

    function partitsCache(id){
      if(!id)return null;
      var data=dillunsActual();
      var x=llegirJSON('ZH_HOME|'+id+'|'+data);
      if(!x||!x.dades)return null;
      // Cache HOME: màxim 5 minuts, alineat amb el LIVE.
      if(Date.now()-Number(x.temps||0)>5*60*1000)return null;
      return {data:data,dades:x.dades};
    }

    function guardarId(id){
      id=String(id||'').trim();
      if(!idValid(id))return false;

      var ok=false;
      try{
        localStorage.setItem(CLAU,id);
        ok=(localStorage.getItem(CLAU)===id);
      }catch(e){}

      try{
        document.cookie=
          COOKIE+'='+encodeURIComponent(id)+
          '; Max-Age=31536000; Path=/; SameSite=Lax';
      }catch(e){}

      return ok;
    }

    function enviarId(){
      var id=assegurarId();
      if(!id||!frame||!frame.contentWindow)return;

      if(zhDiag.primerIdMs==null){
        zhDiag.primerIdMs=Date.now()-zhDiag.iniciMs;
      }

      zhDiag.enviamentsId++;

      try{
        frame.contentWindow.postMessage({
          tipus:'EMP_USR_ID',
          idUsuari:id,
          favoritsCache:favoritsCache(id),
          partitsCache:partitsCache(id),
          vistesCache:viewLlegir(id),
          nouAutomatic:onboardingPendent(id)
        },'*');
      }catch(e){}

      zhDiagGuardar();
    }

    function amagarLoader(){
      if(loaderFora)return;
      loaderFora=true;

      if(zhDiag.loaderForaMs==null){
        zhDiag.loaderForaMs=Date.now()-zhDiag.iniciMs;
        zhDiagGuardar();
      }

      if(timer)clearInterval(timer);
      if(loader){
        loader.classList.add('fora');
        setTimeout(function(){
          if(loader&&loader.parentNode)loader.parentNode.removeChild(loader);
        },260);
      }
    }

    timer=setInterval(function(){
      if(temps){
        temps.textContent=Math.max(0,Math.floor((Date.now()-inici)/1000))+' s';
      }
    },500);

    window.addEventListener('message',function(e){
      if(!frame||e.source!==frame.contentWindow)return;

      var d=e.data||{};

      if(d.tipus==='EMP_USR_SET_ID'){
        var idActual=assegurarId();
        var idFill=String(d.idUsuari||'').trim();

        /*
         * L'iframe no pot substituir l'ID persistent del dispositiu
         * per un altre USR_AUTO diferent.
         */
        if(
          /^USR_AUTO_[A-Fa-f0-9]{16,64}$/.test(idActual) &&
          /^USR_AUTO_[A-Fa-f0-9]{16,64}$/.test(idFill) &&
          idFill!==idActual
        ){
          enviarId();
          return;
        }

        if(idValid(idFill)){
          guardarId(idFill);
        }

        enviarId();
        return;
      }

      if(d.tipus==='EMP_USR_GET_ID'){
        enviarId();
        return;
      }

      if(d.tipus==='ZH_AUTO_ONBOARDING_DONE'){
        var uidAuto=String(d.idUsuari||'').trim();
        if(idValid(uidAuto))onboardingAcabar(uidAuto);
        return;
      }

      if(d.tipus==='ZH_DOCUMENT_READY' || d.tipus==='ZH_APP_READY'){
        if(zhDiag.appReadyMs==null){
          zhDiag.appReadyMs=Date.now()-zhDiag.iniciMs;
          zhDiagGuardar();
        }

        amagarLoader();
        return;
      }

      if(d.tipus==='ZH_FAVORITS_CACHE_SET'){
        var uidFav=String(d.idUsuari||'').trim();
        if(idValid(uidFav) && d.favorits){
          guardarJSON('ZH_FAVS|'+uidFav,d.favorits);
        }
        return;
      }

      if(d.tipus==='ZH_RPC_CACHE_SET'){
        rpcGuardar(d);
        return;
      }

      if(d.tipus==='ZH_RPC_CACHE_CLEAR'){
        rpcEsborrarTot();
        viewEsborrarTot();
        return;
      }

      if(d.tipus==='ZH_VIEW_CACHE_SET'){
        viewGuardar(d);
        return;
      }

      if(d.tipus==='ZH_HOME_CACHE_SET'){
        var uidHome=String(d.idUsuari||'').trim();
        var dataHome=String(d.data||'').trim();
        if(idValid(uidHome) && /^\d{4}-\d{2}-\d{2}$/.test(dataHome) && d.dades){
          guardarJSON(
            'ZH_HOME|'+uidHome+'|'+dataHome,
            {temps:Number(d.temps||Date.now()),dades:d.dades}
          );
        }
        return;
      }
    });

    frame.addEventListener('load',function(){
      zhDiag.iframeLoadMs=Date.now()-zhDiag.iniciMs;
      zhDiagGuardar();

      // V5.4: restaurem primer el cache persistent de pantalles.
      rpcEnviat=false;
      rpcEnviarAlFrame();

      // L'HTML d'Apps Script ja és visible. No esperem dades de Sheets:
      // l'app mostrarà el seu propi estat "Carregant..." dins del contingut.
      amagarLoader();
      enviarId();
      setTimeout(enviarId,180);
      setTimeout(enviarId,700);
      setTimeout(rpcEnviarAlFrame,250);

      setTimeout(function(){
        try{
          console.log(
            'ZH DIAG CARREGA',
            JSON.parse(JSON.stringify(zhDiag))
          );
        }catch(e){}
      },1200);
    });

    // L'iframe ja ha començat a carregar des del mateix HTML.
    // Enviem la identitat tan aviat com sigui possible.
    enviarId();

    // Seguretat: si mai no arriba ZH_APP_READY, no bloquegem la PWA.
    setTimeout(amagarLoader,4000);

    window.ZH_DIAG_MOSTRAR=function(){
      var r={
        iniciMs:zhDiag.iniciMs,
        iframeLoadMs:zhDiag.iframeLoadMs,
        appReadyMs:zhDiag.appReadyMs,
        loaderForaMs:zhDiag.loaderForaMs,
        primerIdMs:zhDiag.primerIdMs,
        enviamentsId:zhDiag.enviamentsId
      };

      try{
        console.log('ZH DIAG CARREGA',r);
      }catch(e){}

      return r;
    };

  })();
  </script>

</body>
</html>
